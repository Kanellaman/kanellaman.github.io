bio:
  short: >-
    Security Engineer in the Offensive Security team at Performance Technologies since September
    2026, and MSc student in Information Security at AUEB. Working on penetration testing and
    red teaming, with prior cloud and DevOps experience across Azure infrastructure, AKS clusters,
    CI/CD pipelines, and ELK observability.
  long: >-
    I graduated with a B.Sc. in Computer Science from the National and Kapodistrian University of
    Athens and am currently pursuing an MSc in Information Systems Development and Security at AUEB.
    Since September 2026, I have been a Security Engineer in the Offensive Security team at
    Performance Technologies, contributing to penetration testing and red teaming engagements,
    including internal and external assessments, malicious guest simulation, and Wi-Fi testing.
    Previously, I worked as a Cloud DevOps Engineer at Performance Technologies, operating Azure
    infrastructure, managing AKS clusters, building CI/CD pipelines, and configuring ELK-based
    observability. My background in Linux, systems programming, networking, and distributed
    systems supports my security work and MSc coursework in areas including vulnerability
    assessment, secure network design, and cryptography.

